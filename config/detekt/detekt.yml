# Project overrides on top of detekt's default configuration.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']

complexity:
  TooManyFunctions:
    # Room DAOs are declarative lists of queries; splitting them hurts readability.
    ignoreAnnotated: ['Dao']
    # Overrides implement framework contracts (Media3 players and sessions, listeners), so only a class's own
    # functions count towards the limit.
    ignoreOverridden: true
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
