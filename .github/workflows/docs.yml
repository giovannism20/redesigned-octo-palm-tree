name: Docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Local links only (files and directories); external sites are not
          # checked so the build does not depend on third-party uptime.
          args: >-
            --offline --no-progress --include-fragments
            --exclude-path .claude/agents
            './**/*.md'
          fail: true
