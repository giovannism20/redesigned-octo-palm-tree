name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history) and guard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (MIT-licensed CLI, built from source)
        run: |
          GOBIN="$HOME/.local/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan the whole git history
        run: gitleaks git --redact --no-banner --verbose .
      - name: Pre-commit guard self-test
        run: scripts/test-secret-guard.sh
